# RunPod deployment manifest for comfyui-first-video (phase 16).
#
# Consumed by the orchestrator's comfy_static_validator node. The
# workflow_path is the source of truth for which workflow JSON gets
# scanned; image_repo / template_id / s3_bucket feed future Stage 2
# (ephemeral GPU pod) and Stage 3 (serverless promote) — currently
# null so the validator emits an `informational` finding, not a block.

workflow_path: .planning/runpod/api-workflow.json
template_id: null
image_repo: null
s3_bucket: null

# Hardware hints (forward-looking; Stage 2/3 will read them when added).
gpu_type: "NVIDIA GeForce RTX 4090"
min_vram_gb: 24
timeout_seconds: 1800
