# Custom-node map for comfyui-first-video. Every `class_type` referenced
# in the workflow must appear as a key here, or the static validator
# emits a `high` finding (`RN002`). The value is the source repo so
# operators can paste a missing class_type into a new entry.
#
# Sources verified against the actual api-workflow-minimal.json
# (the canonical minimal workflow for this project).

