name: Deploy to RunPod Serverless (classic)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

# Avoid concurrent deploys corrupting endpoint state. Sequential.
concurrency:
  group: runpod-deploy
  cancel-in-progress: false

# Secrets used in deploy.yml:
#   RUNPOD_FLASH_API_KEY  — control-plane key (from `flash login`)
#                            → endpoint creation/deletion + /v2/{eid}/health
#   RUNPOD_API_KEY        — data-plane key — DEPRECATED as of phase 17 → phase 18 cutover.
#                            Control-plane key (RUNPOD_FLASH_API_KEY) works on the
#                            data plane too, so we use a single key for both.
# Two separate keys are no longer required.
# Phase 17 cutover (2026-08-11): endpoint id changed 3995g4nz6mxw1v
# → f3l545i0ej27dz; RUNPOD_API_KEY rotated to one bound to new id.
# Phase 18 cutover (2026-08-13): endpoint id changed f3l545i0ej27dz
# → yqad2kbg9gohx7 (classic runtime); classic runpod SDK used directly,
# Flash retired. Refs deploy_classic.py + flash_config_classic.py.

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Docker image push
        # docker.yml runs in parallel; it pushes antongoldobin/comfyui-ltx-video:latest.
        # We don't poll Docker Hub (tag page doesn't carry git SHA, polling is fragile).
        # Instead: brief sleep to let the push complete before Flash pulls the image.
        run: sleep 30

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install runpod SDK
        # We use the classic runpod SDK in the worker (handler.py imports it).
        # We don't need runpod-flash here — the deploy path uses GraphQL directly.
        run: |
          python -m pip install --upgrade pip
          pip install "runpod>=1.7.0" "requests>=2.31"

      - name: Verify classic config imports cleanly
        env:
          ENDPOINT_IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          python -c "from deploy.flash_config_classic import cfg; print('endpoint=', cfg.name, 'image=', cfg.image, 'gpu=', cfg.gpu_id)"

      - name: Deploy to RunPod via classic GraphQL
        env:
          RUNPOD_FLASH_API_KEY: ${{ secrets.RUNPOD_FLASH_API_KEY }}
          ENDPOINT_IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          set -euo pipefail
          python -m scripts.deploy_classic

      - name: Smoke test job
        # Verifies the deploy: API key works, worker accepts job, handler executes.
        # Known FAILURE types that are NOT deploy errors are treated as WARN:
        #   - handler.py:322 ValueError "No workflow found" (synthetic payload)
        #   - timeout (worker cold-start exceeded polling window)
        # Only HTTPError / 4xx / 5xx on submit or NETWORK failures mark deploy bad.
        env:
          RUNPOD_FLASH_API_KEY: ${{ secrets.RUNPOD_FLASH_API_KEY }}
        run: |
          set -euo pipefail
          # Discover the new endpoint id from the API (it may have changed).
          python << 'EOF'
          import os, time, json, requests, sys
          sys.path.insert(0, '.')
          from deploy.flash_config_classic import cfg

          KEY = os.environ['RUNPOD_FLASH_API_KEY']

          # Find the (possibly new) endpoint id by name (classic endpoint may
          # change id on each redeploy).
          r = requests.post(
              "https://api.runpod.io/graphql",
              json={"query": "{ myself { endpoints { id name } } }"},
              headers={"Authorization": f"Bearer {KEY}",
                       "Content-Type": "application/json"},
              timeout=30,
          )
          r.raise_for_status()
          data = r.json()
          if "errors" in data and data["errors"]:
              print(f"❌ GraphQL errors: {data['errors']}")
              raise SystemExit(1)
          endpoints = (data.get("data") or {}).get("myself", {}).get("endpoints") or []
          PROD_EID = next((e["id"] for e in endpoints if e["name"] == cfg.name), None)
          if not PROD_EID:
              print(f"❌ endpoint '{cfg.name}' not found in: {endpoints}")
              raise SystemExit(1)
          print(f"endpoint={cfg.name} id={PROD_EID}")

          url = f"https://api.runpod.ai/v2/{PROD_EID}/run"
          payload = {
              "input": {
                  "flash_smoke_test": True,
                  "ts": time.time(),
              }
          }

          # Submit. Any HTTPError here is a real deploy error (key revoked, endpoint down).
          r = requests.post(url, json=payload,
                            headers={"Authorization": f"Bearer {KEY}"}, timeout=30)
          r.raise_for_status()
          jid = r.json().get("id")
          print(f"smoke job submitted: {jid}")

          # Poll status up to 600s (10 min) — workers cold-start under
          # throttling can take 5-10 min before picking up the job
          # (observed: smoke job a552bbde queued 522s before running).
          status_url = f"https://api.runpod.ai/v2/{PROD_EID}/status/{jid}"
          deadline = time.time() + 600
          while time.time() < deadline:
              sr = requests.get(status_url,
                                headers={"Authorization": f"Bearer {KEY}"}, timeout=10)
              sd = sr.json()
              status = sd.get("status")
              if status in ("COMPLETED", "FAILED", "CANCELLED"):
                  print(f"smoke job {jid}: {status}")
                  if status == "COMPLETED":
                      # Phase 19: handler fast-paths probes (flash_smoke_test,
                      # dry_run, ping, healthcheck) — returns {"status": "ok",
                      # "probe": True} instead of running ComfyUI. So we now
                      # see COMPLETED for our smoke payload, not FAILED.
                      print("✅ smoke job OK (handler fast-path)")
                      raise SystemExit(0)
                  if status == "FAILED":
                      # Legacy behavior (pre-Phase 19): handler raised
                      # ValueError("No workflow found") on synthetic payload.
                      # Still tolerated as WARN for backward compat with old
                      # handler images that haven't deployed the fast-path.
                      err = json.dumps(sd)
                      if "No workflow found" in err or "No workflow" in err:
                          print(f"⚠️  smoke job failed expectedly (no workflow payload): {jid}")
                          print("    (handler.py dispatched our synthetic smoke payload; ValueError is the known no-workflow behavior)")
                          raise SystemExit(0)  # WARN — exit 0 so GH Action passes
                      # Any other FAILED = suspect deploy
                      print(f"❌ smoke job unexpected FAILED: {jid}")
                      print(f"  output: {sd}")
                      raise SystemExit(1)
                  if status == "CANCELLED":
                      print(f"❌ smoke job CANCELLED: {jid}")
                      raise SystemExit(1)
              time.sleep(3)

          # Timeout — worker still cold-starting. Treat as WARN, not fail.
          print(f"⚠️  smoke job did not complete within 600s — leaving queued: {jid}")
          raise SystemExit(0)
          EOF

      - name: Summary
        if: always()
        run: |
          echo "### RunPod Serverless Deploy (classic)" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`antongoldobin/comfyui-ltx-video:${{ inputs.image_tag || 'latest' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint: \`hon_cyan_tiger\` (id discovered at deploy time via GraphQL)" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
