name: Deploy to RunPod Serverless

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (default: latest)"
        required: false
        default: "latest"

# Avoid concurrent deploys corrupting endpoint state. Sequential.
concurrency:
  group: runpod-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for Docker image push
        # docker.yml runs in parallel; it pushes antongoldobin/comfyui-ltx-video:latest.
        # We don't poll Docker Hub (tag page doesn't carry git SHA, polling is fragile).
        # Instead: brief sleep to let the push complete before Flash pulls the image.
        run: sleep 30

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install flash + runpod
        run: |
          python -m pip install --upgrade pip
          pip install "runpod-flash==1.19.0" "runpod>=1.7.0"

      - name: Verify flash config imports cleanly
        env:
          ENDPOINT_IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          python -c "from deploy.flash_config import ep; print('endpoint=', ep.name, 'image=', ep.image)"

      - name: Deploy to RunPod via Flash
        env:
          RUNPOD_FLASH_API_KEY: ${{ secrets.RUNPOD_FLASH_API_KEY }}
          ENDPOINT_IMAGE_TAG: ${{ inputs.image_tag || 'latest' }}
        run: |
          set -euo pipefail
          python -c "
          import asyncio, sys
          sys.path.insert(0, '.')
          from datetime import datetime, timezone
          from deploy.flash_config import ep

          async def deploy():
              # Empty payload — triggers _ensure_endpoint_ready() which deploys
              # the endpoint with the current image. We don't need the job itself.
              try:
                  job = await ep.runsync(
                      {'gh_deploy': True, 'sha': '${{ github.sha }}', 'ts': datetime.now(timezone.utc).isoformat()},
                      timeout=900,
                  )
                  print(f'deploy job: {job.id} status={job.status}')
              except Exception as e:
                  print(f'deploy job warning (endpoint may still be ready): {type(e).__name__}: {e}')

          asyncio.run(deploy())
          "

      - name: Wait for prod worker ready
        env:
          RUNPOD_FLASH_API_KEY: ${{ secrets.RUNPOD_FLASH_API_KEY }}
        run: |
          set -euo pipefail
          python << 'EOF'
          import os, time, requests

          KEY = os.environ['RUNPOD_FLASH_API_KEY']
          PROD_EID = "f3l545i0ej27dz"
          url = f"https://api.runpod.ai/v2/{PROD_EID}/health"

          deadline = time.time() + 600
          start = time.time()
          last = None
          while time.time() < deadline:
              try:
                  r = requests.get(url, headers={"Authorization": f"Bearer {KEY}"}, timeout=10)
                  if r.status_code == 200:
                      h = r.json()
                      w = h.get("workers", {})
                      state = (w.get("ready", 0), w.get("running", 0), w.get("initializing", 0), w.get("unhealthy", 0))
                      if state != last:
                          elapsed = int(time.time() - start)
                          print(f"  t={elapsed:3d}s ready={state[0]} running={state[1]} init={state[2]} unhl={state[3]}")
                          last = state
                      if state[0] >= 1 or state[1] >= 1:
                          print(f"✅ prod worker ready after {elapsed}s")
                          raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  print(f"  poll error: {e}")
              time.sleep(15)
          print("❌ prod worker did not become ready within 600s")
          raise SystemExit(1)
          EOF

      - name: Smoke test job
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          set -euo pipefail
          python << 'EOF'
          import os, time, requests

          KEY = os.environ['RUNPOD_API_KEY']
          PROD_EID = "f3l545i0ej27dz"
          url = f"https://api.runpod.ai/v2/{PROD_EID}/run"

          payload = {
              "input": {
                  "flash_smoke_test": True,
                  "ts": time.time(),
              }
          }
          r = requests.post(url, json=payload, headers={"Authorization": f"Bearer {KEY}"}, timeout=30)
          r.raise_for_status()
          jid = r.json().get("id")
          print(f"smoke job submitted: {jid}")

          # Poll status up to 90s
          status_url = f"https://api.runpod.ai/v2/{PROD_EID}/status/{jid}"
          deadline = time.time() + 90
          while time.time() < deadline:
              sr = requests.get(status_url, headers={"Authorization": f"Bearer {KEY}"}, timeout=10)
              sd = sr.json()
              status = sd.get("status")
              if status in ("COMPLETED", "FAILED", "CANCELLED"):
                  print(f"smoke job {jid}: {status}")
                  if status == "FAILED":
                      print(f"  output: {sd}")
                  raise SystemExit(0 if status != "FAILED" else 1)
              time.sleep(3)

          print("⚠️ smoke job did not complete within 90s — leaving queued")
          EOF

      - name: Summary
        if: always()
        run: |
          echo "### RunPod Flash Deploy" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image: \`antongoldobin/comfyui-ltx-video:${{ inputs.image_tag || 'latest' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoint: \`hon_cyan_tiger\` (\`f3l545i0ej27dz\`)" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
